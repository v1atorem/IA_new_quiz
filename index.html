#ivq *{box-sizing:border-box}
body{margin:0;background:#0d0c0f}

#ivq .meta{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 26px}
#ivq .pill{font:600 13px/1 var(--fBody);padding:9px 14px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:#fff}
#ivq .pill:first-child{background:#fff;color:var(--red);border-color:#fff;transform:rotate(-3deg)}
#ivq .btn{appearance:none;border:0;cursor:pointer;width:100%;padding:19px 22px;border-radius:50px;background:linear-gradient(0deg,var(--red),var(--red2));color:#fff;font:600 15px/1.2 var(--fBtn);text-transform:uppercase;letter-spacing:.04em;box-shadow:0 10px 30px rgba(225,43,30,.35);transition:transform .12s,filter .2s,opacity .2s}
#ivq .btn:hover{filter:brightness(1.12)}
#ivq .btn:active{transform:scale(.985)}
#ivq .btn[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none;filter:grayscale(.4)}

#ivq .btn.ghost:hover{color:#fff;background:var(--card2);filter:none}
#ivq .note{font-size:13px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.45}

#ivq .opt .k{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:transparent;border:1.5px solid #4a4950;font:600 15px/1 var(--fHead);color:var(--muted)}
#ivq .opt.sel{border-color:var(--red);background:var(--redSoft)}
#ivq .opt.sel .k{background:linear-gradient(0deg,var(--red),var(--red2));border-color:var(--red);color:#fff}

#ivq .fb{margin-top:16px;padding:16px 18px;border-radius:16px;background:#fff;color:#0d0c0f;animation:ivqIn .3s ease;position:relative}

#ivq form .btn{margin-top:4px}

#ivq .done{text-align:center;padding:12px 0}

</style>

 if(state.ans.q1===3)return '<span class="tag">Твоя цель — знания для себя</span><h2>Лучше разбираться <em>в собственных тренировках</em></h2><p>Подготовка к работе с клиентами сейчас не является твоей целью. При выборе обучения посмотри, насколько его содержание подходит именно тебе.</p>';
 var t=track();
 if(state.branch==='gp')return gpRecommendation();
 if(t==='tz')return '<span class="tag">Твой результат · Тренажёрный зал</span><h2>Присмотрись к работе <em>тренером тренажёрного зала</em></h2><p>Ты выбрал персональную работу: помогать человеку освоить упражнения и двигаться к его цели.</p><div class="result-topics"><p class="white"><strong>На обучении предстоит разобраться:</strong></p><ul><li>Как подбирать упражнения и нагрузку.</li><li>Как следить за техникой.</li><li>Как составлять программу под задачи клиента.</li></ul></div>';
 if(t==='gp')return '<span class="tag">Твой результат · Групповые программы</span><h2>Присмотрись к работе <em>тренером групповых программ</em></h2><p>Ты выбрал формат, в котором тренер ведёт занятие для нескольких клиентов и задаёт общий темп.</p><div class="result-topics"><p class="white"><strong>На обучении предстоит разобраться:</strong></p><ul><li>Как выстроить занятие.</li><li>Как показывать и объяснять упражнения.</li><li>Как следить за техникой клиентов.</li></ul></div><p>Следующий шаг — сравнить направления: йогу, пилатес, стретчинг, силовые, Kick и Cycle.</p>';
 return '<span class="tag">Твой результат · Сравнение направлений</span><h2>Начни со сравнения <em>двух направлений</em></h2><div class="compare"><div><h3>Тренер тренажёрного зала</h3><p>Подбирает упражнения и нагрузку под задачи клиента, объясняет технику и отслеживает прогресс.</p></div><div><h3>Тренер групповых программ</h3><p>Проводит занятие для нескольких клиентов: показывает упражнения, объясняет движения и управляет темпом тренировки.</p></div></div><p>Чтобы выбрать, сравни содержание обучения, практику и ежедневные задачи тренера.</p>';
}

function gpRecommendation(){
 var options=gpOptions(),multiple=options.length>1,compare=options.length===1&&options[0].compare;
 var label=options.map(function(o){return o.l;}).join(' + ');
 var h=compare?'Выбери своё сочетание <em>групповых направлений</em>':(multiple?'Твои направления — <em>':'Твоё направление — <em>')+esc(label)+'</em>';
 var intro=multiple?'Ты выбрал несколько направлений. На карьерном разборе обсудим, как освоить их поэтапно и подготовиться к ведению разных занятий.':options[0].resultIntro;
 return '<span class="tag">Твой результат · Групповые программы</span><h2>'+h+'</h2><p>'+esc(intro)+'</p><div class="result-topics"><p class="white"><strong>Больше направлений — больше форматов работы</strong></p><p>Например, стретчинг + силовые позволяют вести и мягкие, и силовые занятия. С такими навыками можно рассматривать вакансии с разными требованиями.</p></div><div class="result-topics"><p class="white"><strong>Тебе предстоит научиться:</strong></p><ul><li>Выстраивать занятие и подбирать упражнения.</li><li>Понятно показывать и объяснять движения.</li><li>Следить за техникой клиентов с разным уровнем подготовки.</li></ul></div><p>На бесплатном карьерном разборе поможем выбрать сочетание направлений и обсудим обучение, практику и первые шаги к работе.</p>';
}

function renderResult(forceRecommendation){
 var key=state.branch+JSON.stringify(state.ans)+state.cityOther;if(state.completedKey!==key){emit('QuizComplete',{branch:state.branch,specialty:specialty(),direction:DIR_LABEL[track()],goal:Q[0].opts[state.ans.q1].l,qualification:qualification()});state.completedKey=key;}
 var free=state.ans.q6===3&&!forceRecommendation;
 if(free){
 root.innerHTML='<div class="screen">'+progress(6)+'<span class="tag">Первый шаг — знакомство с профессией</span><h2>Начни со знакомства <em>с работой тренера</em></h2><p>До выбора обучения попробуй три шага:</p><div class="result-topics"><ul><li>Поговори с работающим тренером о его графике и повседневных задачах.</li><li>Посети персональную тренировку и групповое занятие, обращая внимание на работу тренера.</li><li>Выпиши, что тебе нравится в этой профессии и какие вопросы пока остаются.</li></ul></div><p>Так будет проще понять, хочешь ли ты тренировать других людей.</p><button class="btn" id="ivq-view" type="button">Посмотреть мой результат</button><div class="nav"><button class="btn ghost" id="ivq-back" type="button">← Изменить ответы</button></div></div>';
 if(state.branch==='gp'){root.querySelector('.result-topics ul').innerHTML='<li>Посети занятия по йоге, пилатесу, стретчингу, силовым, Kick или Cycle и сравни форматы.</li><li>Поговори с тренером о подготовке к занятиям и работе с группой.</li><li>Выпиши, какое направление хочется изучить глубже и какие вопросы остаются.</li>';}
 document.getElementById('ivq-view').onclick=function(){renderResult(true);goTop();};
 }else{
 root.innerHTML='<div class="screen">'+progress(6)+recommendation()+'<div class="personal">'+personal()+'</div><div class="offer"><div class="offer-h">Как тебе начать работать тренером?</div><p>Приходи на <strong class="white">бесплатный карьерный разбор в INVICTUS Academy.</strong></p><ul><li>Обсудим твой опыт и цель.</li><li>Поможем выбрать направление и подходящую подготовку.</li><li>Разберём первые шаги к работе и заработку в фитнесе.</li></ul><p class="offer-note">Ты сможешь задать вопросы об обучении, практике и помощи с трудоустройством.</p><button class="btn result-cta" id="ivq-book" type="button">Записаться на бесплатный разбор</button></div><div id="ivq-form-slot"></div><div class="nav"><button class="btn ghost" id="ivq-back" type="button">← Изменить ответы</button></div></div>';
 if(state.branch==='gp'&&state.ans.q1!==3){root.querySelector('.offer-h').textContent='Как тебе начать вести групповые занятия?';root.querySelector('.offer ul').innerHTML='<li>Обсудим твой опыт в групповых занятиях и цель.</li><li>Поможем выбрать одно или несколько направлений и подготовку к ведению группы.</li><li>Разберём первые шаги к работе тренером групповых программ.</li>';}
 if(state.ans.q1===3){root.querySelector('.offer-h').textContent='Обсуди свою цель на бесплатном разборе';root.querySelector('.offer>p').innerHTML='Разберём, какие знания тебе нужны для собственных тренировок и какие программы стоит рассмотреть.';root.querySelector('.offer ul').innerHTML='<li>Обсудим твой опыт и цель.</li><li>Поможем разобраться в содержании программ.</li><li>Ответим на вопросы об обучении и практике.</li>';}
 document.getElementById('ivq-book').onclick=function(){renderForm();document.getElementById('ivq-form').scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('ivq-name').focus({preventScroll:true});};
 }
 document.getElementById('ivq-back').onclick=function(){state.i=5;renderQ();goTop();};
}
function renderForm(){
 if(document.getElementById('ivq-form'))return;
 emit('CareerFormView',{branch:state.branch,specialty:specialty()});
 document.getElementById('ivq-form-slot').innerHTML='<form id="ivq-form" novalidate><div class="form-h">Твой первый шаг к новой профессии</div><p class="form-description">Оставь контакты — свяжемся в WhatsApp и согласуем время бесплатного карьерного разбора.</p><label class="f" for="ivq-name">Как тебя зовут?</label><div class="field"><input id="ivq-name" type="text" name="name" autocomplete="given-name" maxlength="80" placeholder="Имя" value="'+esc(state.contact.name)+'" aria-describedby="ivq-name-error"><span class="err" id="ivq-name-error">Напиши, как к тебе обращаться</span></div><label class="f" for="ivq-phone">Твой номер WhatsApp</label><div class="field"><input id="ivq-phone" type="tel" name="phone" autocomplete="tel" inputmode="tel" placeholder="+7 (___) ___-__-__" value="'+esc(state.contact.phone)+'" aria-describedby="ivq-phone-error"><span class="err" id="ivq-phone-error">Проверь номер: нужно 10 цифр после +7</span></div><p id="ivq-send-error" class="send-error" role="alert" hidden></p><button class="btn" type="submit" id="ivq-submit">Записаться на бесплатный разбор</button><div class="note">Разбор бесплатный и не обязывает покупать обучение.</div></form>';
 var form=document.getElementById('ivq-form'),name=form.elements.namedItem('name'),phone=form.elements.namedItem('phone');
 name.oninput=function(){state.contact.name=name.value;};phone.onfocus=function(){if(!phone.value)phone.value='+7 (';};phone.oninput=function(){phone.value=maskPhone(phone.value);state.contact.phone=phone.value;};
 form.onsubmit=async function(e){
  e.preventDefault();var ok=true;
  function check(el,valid,id){el.classList.toggle('invalid',!valid);el.setAttribute('aria-invalid',String(!valid));document.getElementById(id).classList.toggle('show',!valid);if(!valid)ok=false;}
  check(name,name.value.trim().length>=2,'ivq-name-error');check(phone,/^7\d{10}$/.test(phone.value.replace(/\D/g,'')),'ivq-phone-error');if(!ok){form.querySelector('.invalid').focus();return;}
  var data={formname:CONFIG.formName,request_type:'Бесплатный карьерный разбор',name:name.value.trim(),phone:'+'+phone.value.replace(/\D/g,''),city:city(),branch:state.branch,branch_name:state.branch==='gp'?DIR_LABEL.gp:DIR_LABEL.tz,direction:DIR_LABEL[track()],group_specialty:specialty(),goal:Q[0].opts[state.ans.q1].l,experience:Q[1].opts[state.ans.q2].l,start:Q[4].opts[state.ans.q5].l,payment_readiness:Q[5].opts[state.ans.q6].l,qualification:qualification(),page:location.href.split('#')[0],referrer:document.referrer,created_at:new Date().toISOString()};
  Q.forEach(function(q){data[q.id]=answerText(q);});Object.assign(data,utm);
  if(!CONFIG.endpoint){renderDone(data,true);goTop();return;}
  var btn=document.getElementById('ivq-submit'),err=document.getElementById('ivq-send-error');btn.disabled=true;btn.textContent='Отправляем…';err.hidden=true;
  try{await send(data);emit('Lead',{content_name:'Бесплатный карьерный разбор',content_category:data.direction,branch:data.branch,specialty:data.group_specialty});if(CONFIG.redirectAfterSubmit){location.href=CONFIG.redirectAfterSubmit;return;}renderDone(data,false);goTop();}
  catch(e){btn.disabled=false;btn.textContent='Записаться на бесплатный разбор';err.textContent='Не удалось отправить заявку. Попробуй ещё раз чуть позже.';err.hidden=false;}
 };
}
function qualification(){if(state.ans.q6===3)return 'Только бесплатные материалы';if(state.ans.q1===3)return 'Обучение для себя';if(state.ans.q5===0&&state.ans.q6<2)return 'Приоритетный контакт';return 'Нужна консультация';}
function renderDone(d,preview){
 root.innerHTML='<div class="screen done"><div class="ico" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><h2>'+(preview?'Это предпросмотр <em>записи на разбор</em>':'Заявка на карьерный разбор <em>принята</em>')+'</h2><p>'+(preview?esc(d.name)+', в этой версии заявка не отправляется. Здесь после подключения приёма заявок появится подтверждение записи.':esc(d.name)+', свяжемся с тобой в WhatsApp по номеру '+esc(d.phone)+', чтобы согласовать время.')+'</p><p>Подумай, что хочешь обсудить в первую очередь: выбор направления, обучение или начало работы тренером.</p>'+(CONFIG.whatsapp&&!preview?'<a class="btn link-btn" target="_blank" rel="noopener" href="https://wa.me/'+esc(CONFIG.whatsapp)+'?text='+encodeURIComponent('Здравствуйте! Хочу записаться на бесплатный карьерный разбор. Направление: '+d.direction)+'">Написать в WhatsApp</a>':'')+(preview?'<button class="btn ghost" type="button" id="ivq-preview-back">← Вернуться к результату</button>':'')+'</div>';
 if(preview)document.getElementById('ivq-preview-back').onclick=function(){renderResult(true);renderForm();goTop();};
}
function maskPhone(v){var d=v.replace(/\D/g,'');if(!d)return '';if(d.length===10&&v.trim().charAt(0)!=='+')d='7'+d;else if(d[0]==='8')d='7'+d.slice(1);if(d[0]!=='7')d='7'+d;d=d.slice(0,11);var r='+7';if(d.length>1)r+=' ('+d.slice(1,4);if(d.length>=4)r+=')';if(d.length>4)r+=' '+d.slice(4,7);if(d.length>7)r+='-'+d.slice(7,9);if(d.length>9)r+='-'+d.slice(9,11);return r;}
function readUtm(){var keys=['utm_source','utm_medium','utm_campaign','utm_content','utm_term','utm_id','fbclid','gclid','yclid'],o={},saved={};try{saved=JSON.parse(sessionStorage.getItem('ivq_utm')||'{}');}catch(e){}var p=new URLSearchParams(location.search);keys.forEach(function(k){o[k]=p.get(k)||saved[k]||'';});try{sessionStorage.setItem('ivq_utm',JSON.stringify(o));}catch(e){}return o;}
async function send(data){var fd=new URLSearchParams();Object.keys(data).forEach(function(k){fd.append(k,data[k]==null?'':String(data[k]));});var r=await fetch(CONFIG.endpoint,{method:'POST',body:fd,redirect:'follow'});if(!r.ok)throw new Error('HTTP '+r.status);if((r.headers.get('content-type')||'').includes('application/json')){var body=await r.json();if(body.success===false||body.ok===false)throw new Error('Application rejected');}}
renderStart();
})();

</script>
